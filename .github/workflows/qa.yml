name: Prüfung

# Läuft bei jedem Push und jedem Pull Request. Die statischen Prüfungen
# brauchen nur Python; der Browserlauf ist separat, weil er Playwright
# und mehr Zeit benötigt.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  statisch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links, IDs, Alt-Texte, CSP
        run: python3 tools/qa_site.py --static-only
      - name: Suchmaschinen und soziale Vorschau
        run: python3 tools/qa_seo.py
      - name: Sicherheit
        run: python3 tools/qa_security.py
      - name: Landmarken und Sprungmarken
        run: python3 tools/a11y_landmarks.py --check
      - name: CSP-Verschärfung vollständig
        run: python3 tools/csp_harden.py --check
      - name: Keine Inline-Stile mehr
        run: python3 tools/csp_styles.py --check
      - name: Übersetzungen vollständig
        run: |
          python3 tools/i18n_products.py --check
          python3 tools/i18n_cards.py --check
          python3 tools/i18n_static.py --check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright installieren
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Lokaler Server
        run: python3 -m http.server 8809 --bind 127.0.0.1 &
      - name: Barrierefreiheit
        run: python3 tools/qa_a11y.py --base http://127.0.0.1:8809
      - name: Eingaben im Browser
        run: python3 tools/qa_xss.py --base http://127.0.0.1:8809
      - name: Tastaturbeduerung
        run: python3 tools/qa_keyboard.py --base http://127.0.0.1:8809
      - name: Forum als Funktion
        run: python3 tools/qa_forum.py --base http://127.0.0.1:8809
      - name: Entwickler-Abo bis ins Formular
        run: python3 tools/qa_abo.py --base http://127.0.0.1:8809

  # Firefox und WebKit in einem eigenen Job: der Lauf dauert länger und
  # soll die schnellen Prüfungen nicht aufhalten. WebKit setzt
  # upgrade-insecure-requests aus der CSP auch auf localhost um, deshalb
  # läuft dieser Job über einen lokalen TLS-Server.
  crossbrowser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright installieren
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install --with-deps firefox webkit
      - name: Selbstsigniertes Zertifikat
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/bw-key.pem -out /tmp/bw-cert.pem -days 2 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: HTTPS-Server starten
        run: |
          nohup python3 tools/qa_tls_server.py --port 8443 --dir . \
            > /tmp/tls.log 2>&1 &
          sleep 2
          curl -sk -o /dev/null -w "%{http_code}\n" https://127.0.0.1:8443/index.html
      - name: Firefox und WebKit
        run: python3 tools/qa_crossbrowser.py --base https://127.0.0.1:8443
